<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Test loadScript</title>
    <script>
      function loadScript(src, callback) {
        let script = document.createElement('script');
        script.src = src;

        script.onload = () => callback(null, script);
        script.onerror = () =>
          callback(new Error(`Script load error for ${src}`));

        document.head.append(script);
      }

      loadScript(
        'https://cdnjs.cloudflare.com/ajax/libs/lodash.js/3.2.0/lodash.js',
        (script) => {
          alert(`Cool, the script ${script.src} is loaded`);
          alert(_); // akan menampilkan fungsi lodash (atau [object Function])
          console.log('window._ exists?', typeof _);
          console.log('_.chunk example:', _.chunk([1, 2, 3, 4], 2));
        }
      );
    </script>
  </head>
  <body>
    <h1>Open console to see output</h1>
  </body>
</html>
